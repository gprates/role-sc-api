AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'role-sc-api - API REST para eventos culturais e municipais de SC'

Parameters:
  MongoDbUri:
    Type: String
    Description: Connection string do MongoDB Atlas
    NoEcho: true
  MongoDbName:
    Type: String
    Description: Nome do banco de dados
    Default: role_sc
  JwtSecret:
    Type: String
    Description: Secret para assinar tokens JWT
    NoEcho: true
  JwtExpiresIn:
    Type: String
    Description: Tempo de expiração do token JWT
    Default: 7d
  SesFromEmail:
    Type: String
    Description: Remetente verificado no SES (email pessoal ou do domínio)
  SesAwsRegion:
    Type: String
    Description: Região do SES (us-east-1 recomendado — sa-east-1 não tem SES)
    Default: us-east-1
  AppBaseUrl:
    Type: String
    Description: Base URL pública da API, usada para montar o link no email (sem barra final)
  S3AvatarsBucket:
    Type: String
    Description: Nome do bucket S3 para armazenar avatares de usuário
    Default: role-sc-avatars
  S3AvatarsRegion:
    Type: String
    Description: Região do bucket S3 de avatares (mesma da Lambda recomendada)
    Default: sa-east-1

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs24.x

Resources:
  RoleScApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Minify: true
        Target: node24
        Sourcemap: false
        EntryPoints:
          - handler.ts
        # External vazio: bundla TUDO (incluindo @aws-sdk/client-sesv2,
        # que não vem pré-instalado no runtime nodejs24.x).
        External: []
    Properties:
      FunctionName: ROLE_SC_API
      Handler: handler.handler
      CodeUri: src/
      Description: API REST Fastify para o app Rolê SC
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
          MONGODB_DB_NAME: !Ref MongoDbName
          JWT_SECRET: !Ref JwtSecret
          JWT_EXPIRES_IN: !Ref JwtExpiresIn
          SES_FROM_EMAIL: !Ref SesFromEmail
          SES_AWS_REGION: !Ref SesAwsRegion
          APP_BASE_URL: !Ref AppBaseUrl
          S3_AVATARS_BUCKET: !Ref S3AvatarsBucket
          S3_AVATARS_REGION: !Ref S3AvatarsRegion
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
            # Avatares: presigned PUT, HEAD/GET de validação no confirm e
            # DeleteObject (reservado pra cleanup futuro — ex.: deletar conta).
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub 'arn:aws:s3:::${S3AvatarsBucket}/avatars/*'
      Events:
        # Rota pública: clicada pelo browser a partir do link do email.
        # NÃO exige x-api-key porque o usuário não tem como informar a chave.
        VerifyEmail:
          Type: Api
          Properties:
            Path: /auth/verify-email
            Method: GET
            RestApiId: !Ref RoleScRestApi
            Auth:
              ApiKeyRequired: false
        # Catch-all protegido por API Key — cobre todo o resto da API.
        ApiCatchAll:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId: !Ref RoleScRestApi

  RoleScAvatarsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3AvatarsBucket
      # IMPORTANTE: os 4 blocks padrão da AWS (true desde 2023) precisam ficar
      # OFF pra a bucket policy pública abaixo funcionar. Sem isso, mesmo a
      # policy correta é ignorada.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ['*']
            AllowedMethods: [GET, PUT, HEAD]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3000

  RoleScAvatarsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RoleScAvatarsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadAvatars
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${RoleScAvatarsBucket}/avatars/*'

  RoleScRestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: role-sc-api
      StageName: prod
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Authorization, Content-Type, x-api-key'"
        AllowMethods: "'GET, POST, PATCH, OPTIONS'"
      Auth:
        ApiKeyRequired: true

  RoleScApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn:
      - RoleScRestApiprodStage
    Properties:
      Name: role-sc-api-key
      Enabled: true
      StageKeys:
        - RestApiId: !Ref RoleScRestApi
          StageName: prod

  RoleScUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - RoleScRestApiprodStage
    Properties:
      UsagePlanName: role-sc-usage-plan
      Throttle:
        RateLimit: 50
        BurstLimit: 25
      Quota:
        Limit: 10000
        Period: DAY
      ApiStages:
        - ApiId: !Ref RoleScRestApi
          Stage: prod

  RoleScUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref RoleScApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref RoleScUsagePlan

Outputs:
  ApiUrl:
    Description: URL da API
    Value: !Sub 'https://${RoleScRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  FunctionArn:
    Description: ARN da Lambda
    Value: !GetAtt RoleScApiFunction.Arn
  ApiKeyId:
    Description: ID da API Key (use 'aws apigateway get-api-key --api-key <id> --include-value' para ver o valor)
    Value: !Ref RoleScApiKey
  AvatarsBucketName:
    Description: Nome do bucket S3 para avatares
    Value: !Ref RoleScAvatarsBucket
  AvatarsBucketUrl:
    Description: Base URL pública dos avatares
    Value: !Sub 'https://${RoleScAvatarsBucket}.s3.${S3AvatarsRegion}.amazonaws.com'
